spring.application.name=sbj-mongodb-crud
server.port=8080

# Conexión a MongoDB (se puede sobrescribir con la variable de entorno MONGODB_URI)
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/catalog}

# BigDecimal como Decimal128 (por defecto se guardaría como texto y no se podría sumar ni promediar en la base)
spring.mongodb.representation.big-decimal=decimal128

# Los índices (@Indexed) se crean al arrancar
spring.data.mongodb.auto-index-creation=true

# Datos de ejemplo al iniciar con la colección vacía
app.seed=true
