name: CI

# Compila y ejecuta las pruebas en cada push a main, en los pull requests y a mano.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Un push nuevo cancela la ejecución anterior de la misma rama.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilar y probar
    # Ubuntu 24.04 fijo: MongoDB 8.x no arranca con el kernel 6.19 o posterior de ubuntu-latest (Ubuntu 26).
    # Ver https://jira.mongodb.org/browse/SERVER-121912
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # MongoDB para las pruebas de integración: con MONGODB_URI definida, las pruebas usan este servicio
    # en lugar de levantar su propio contenedor con Testcontainers.
    services:
      mongodb:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - name: Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compilar y ejecutar las pruebas
        run: mvn -B -ntp verify
        env:
          MONGODB_URI: mongodb://localhost:27017/catalog
